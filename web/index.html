<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeKnora 知识问答</title>
<style>
  :root {
    --green: #10a95c; --green-dark: #0c8a4a; --bg: #f4f7f5;
    --bubble-user: #10a95c; --bubble-ai: #ffffff; --ink: #1f2d27;
    --muted: #6b7f76; --line: #dfe8e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #0c8a4a, #10a95c); color: #fff;
    padding: 14px 22px; display: flex; align-items: baseline; gap: 14px;
    flex-wrap: wrap; box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  header .meta { font-size: 12px; opacity: .85; }
  #chat {
    flex: 1; overflow-y: auto; padding: 22px 18px;
    display: flex; flex-direction: column; gap: 14px; max-width: 980px;
    width: 100%; margin: 0 auto;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.65; font-size: 14.5px; white-space: pre-wrap;
    word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .row.user .bubble { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
  .row.ai .bubble { background: var(--bubble-ai); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .tools { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .tool {
    font-size: 12px; color: var(--muted); background: #eef4f0;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; align-self: flex-start; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool b { color: var(--green-dark); font-weight: 600; }
  .tool.err { color: #b23b3b; background: #f9eded; border-color: #ecd5d5; }
  .status { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .answer h2, .answer h3, .answer h4 { margin: 10px 0 6px; line-height: 1.4; }
  .answer h2 { font-size: 16px; } .answer h3 { font-size: 15px; } .answer h4 { font-size: 14px; }
  .answer p { margin: 6px 0; }
  .answer ul { margin: 6px 0 6px 18px; }
  .answer li { margin: 3px 0; }
  .answer code {
    font-family: Consolas, monospace; font-size: 12.5px; background: #eef4f0;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  .answer table {
    border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%;
  }
  .answer th, .answer td {
    border: 1px solid var(--line); padding: 5px 9px; text-align: left;
    vertical-align: top;
  }
  .answer th { background: #eef4f0; font-weight: 600; }
  .cursor::after {
    content: "▍"; color: var(--green); animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .err-text { color: #b23b3b; }
  footer {
    border-top: 1px solid var(--line); background: #fff; padding: 12px 18px;
  }
  #inputbar {
    max-width: 980px; margin: 0 auto; display: flex; gap: 10px;
  }
  #question {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 14.5px; font-family: inherit; outline: none;
    height: 46px; max-height: 120px; line-height: 1.5;
  }
  #question:focus { border-color: var(--green); }
  #send {
    background: var(--green); color: #fff; border: 0; border-radius: 10px;
    padding: 0 22px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  #send:disabled { background: #a8cbbb; cursor: not-allowed; }
  #send:not(:disabled):hover { background: var(--green-dark); }
  .hint { max-width: 980px; margin: 6px auto 0; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>WeKnora 知识问答</h1>
  <span class="meta" id="meta">正在加载配置…</span>
</header>
<div id="chat"></div>
<footer>
  <div id="inputbar">
    <textarea id="question" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">回答基于 WeKnora 检索结果，附带 chunk 级引用；证据不足时会明确说明。</div>
</footer>
<script>
const chatEl = document.getElementById("chat");
const qEl = document.getElementById("question");
const sendEl = document.getElementById("send");
const metaEl = document.getElementById("meta");
let busy = false;

fetch("/api/info").then(r => r.json()).then(info => {
  let host = "未知";
  try { host = new URL(info.mcp_url).host; } catch (_) {}
  metaEl.textContent = `模型 ${info.model} · ${info.knowledge_bases} 个知识库 · WeKnora ${host}`;
}).catch(() => { metaEl.textContent = "配置加载失败"; });

function addRow(cls) {
  const row = document.createElement("div");
  row.className = "row " + cls;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

// 极简 markdown：覆盖该 Agent 回答实际用到的标题/列表/表格/加粗/行内代码。
function renderMarkdown(text) {
  const lines = escapeHtml(text).split(/\r?\n/);
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      out.push(`<h${heading[1].length}>${inlineMd(heading[2])}</h${heading[1].length}>`);
      i++; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        rows.push(lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|"));
        i++;
      }
      if (rows.length > 1 && rows[1].every(c => /^\s*:?-{2,}:?\s*$/.test(c))) {
        rows.splice(1, 1);
      }
      const cell = c => `<td>${inlineMd(c.trim())}</td>`;
      const head = rows.shift().map(c => `<th>${inlineMd(c.trim())}</th>`).join("");
      const body = rows.map(r => `<tr>${r.map(cell).join("")}</tr>`).join("");
      out.push(`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`);
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(`<li>${inlineMd(lines[i].replace(/^\s*[-*]\s+/, ""))}</li>`);
        i++;
      }
      out.push(`<ul>${items.join("")}</ul>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() &&
           !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\|/.test(lines[i]) &&
           !/^#{1,4}\s/.test(lines[i])) {
      para.push(inlineMd(lines[i]));
      i++;
    }
    out.push(`<p>${para.join("<br>")}</p>`);
  }
  return out.join("");
}

function toolLine(name, args, status) {
  const el = document.createElement("div");
  el.className = "tool" + (status === "error" ? " err" : "");
  const label = status === "error" ? "✗" : (status ? "✓" : "🔧");
  const b = document.createElement("b");
  b.textContent = `${label} ${name}`;
  el.appendChild(b);
  if (args) {
    const span = document.createElement("span");
    span.textContent = " " + args;
    el.appendChild(span);
  }
  return el;
}

async function ask() {
  const question = qEl.value.trim();
  if (!question || busy) return;
  busy = true; sendEl.disabled = true;
  addRow("user").textContent = question;
  qEl.value = ""; qEl.style.height = "46px";

  const bubble = addRow("ai");
  const tools = document.createElement("div");
  tools.className = "tools";
  bubble.appendChild(tools);
  const status = document.createElement("div");
  status.className = "status cursor";
  status.textContent = "思考中";
  bubble.appendChild(status);
  const answerEl = document.createElement("div");
  answerEl.className = "answer";
  bubble.appendChild(answerEl);

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // SSE 帧以空行分隔（服务端为 \r\n\r\n）。
      const frames = buf.split(/\r?\n\r?\n/);
      buf = frames.pop();
      for (const frame of frames) {
        const line = frame.split(/\r?\n/).find(l => l.startsWith("data:"));
        if (!line) continue;
        let evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch (_) { continue; }
        if (evt.type === "status") {
          status.textContent = evt.text;
        } else if (evt.type === "tool") {
          status.remove(); status.textContent = "";
          tools.appendChild(toolLine(evt.name, evt.args, ""));
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (evt.type === "tool_result") {
          const last = [...tools.children].reverse().find(t => t.textContent.includes(evt.name));
          if (last && evt.status === "error") last.classList.add("err");
        } else if (evt.type === "answer") {
          status.classList.remove("cursor"); status.remove();
          answerEl.innerHTML = renderMarkdown(evt.text);
        } else if (evt.type === "error") {
          status.classList.remove("cursor");
          status.textContent = evt.message;
          status.classList.add("err-text");
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
  } catch (err) {
    status.classList.remove("cursor");
    status.textContent = "连接失败，请确认 WeKnora 服务与演示前端是否在运行";
    status.classList.add("err-text");
  } finally {
    status.classList.remove("cursor");
    busy = false; sendEl.disabled = false; qEl.focus();
  }
}

sendEl.addEventListener("click", ask);
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
qEl.focus();
</script>
</body>
</html>
