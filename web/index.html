    <a href="#/materials" data-route="materials" class="nav-item">

    <a href="#/wiki" data-route="wiki" class="nav-item">

<main class="main">
  <header class="topbar">
    <div class="tb-group">
      <label class="tb-label">当前账号</label>
      <select id="user-select" class="input select"></select>
      <button id="login-btn" class="btn small">配置 Token</button>
      <span id="token-status" class="badge gray">待连接</span>
    </div>
    <div class="tb-group">
      <span id="endpoint-badge" class="badge info" title="MCP 端点（由 .env 固定）">端点加载中…</span>
    </div>
    <div class="tb-group tb-kbs">
      <label class="tb-label">范围</label>
      <span id="scope-summary" class="muted" style="font-size:12px">配置有效 Token 后加载知识库</span>
    </div>
  </header>

  <div class="content">
    <div class="page-intro">
      <div><div class="eyebrow">YOUR KNOWLEDGE, CONNECTED</div><h1 id="page-title">从一份资料开始</h1><p id="page-description">上传、解析、核对原文，让每一次回答都有依据。</p></div>
      <div class="intro-mark" aria-hidden="true"><span>文件</span><i>→</i><span>知识</span><i>→</i><span>答案</span></div>
    </div>
    <section id="view-materials" class="view"></section>
    <section id="view-library" class="view"></section>
    <section id="view-docs" class="view"></section>
    <section id="view-search" class="view"></section>
    <section id="view-wiki" class="view"></section>
    <section id="view-graph" class="view"></section>
    <section id="view-agents" class="view"></section>
    <section id="view-qa" class="view"></section>
    <section id="view-bench" class="view"></section>
  </div>
</main>

<aside id="trace-drawer" class="drawer">
  <div class="drawer-head">
    <b>MCP 调用轨迹</b>
    <div>
      <button id="trace-clear" class="btn ghost small">清空</button>
      <button id="trace-close" class="btn ghost small">关闭</button>
    </div>
  </div>
  <div id="trace-list" class="trace-list"></div>
</aside>

<div id="modal-root" class="modal-root hidden">
  <div class="modal-mask"></div>
  <div id="modal-box" class="modal-box"></div>
</div>
